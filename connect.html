<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Proxy</title>
<style>
:root{--bg:#f4f9fd;--fg:#12324a;--card:#fff;--acc:#2aa3e0;--muted:#5b7488}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a24;--fg:#e6f1f8;--card:#16263a;--muted:#93aabd}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.c{background:var(--card);border-radius:16px;padding:28px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 20px #0001}
a.b{display:block;background:var(--acc);color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:600;margin:18px 0 10px}
.s{color:var(--muted);font-size:14px}.s a{color:var(--acc)}
</style></head><body><div class="c">
<h2 style="margin:0 0 6px">Opening Telegram…</h2>
<div class="s">در حال باز کردن تلگرام… · Открываем Telegram…</div>
<a class="b" id="go" href="#">Connect Proxy · اتصال · Подключить</a>
<div class="s">Not opening? <a id="web" href="#">Try this link</a><br>
More proxies: <a href="https://t.me/TGProxyMax">@TGProxyMax</a></div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var s=q.get("server")||"",p=q.get("port")||"",k=q.get("secret")||"";
  if(!/^[A-Za-z0-9.\-]{3,253}$/.test(s)||!/^\d{1,5}$/.test(p)||!/^[A-Za-z0-9_\-=+\/]{16,512}$/.test(k)){
    document.querySelector("h2").textContent="Invalid link";return;}
  var qs="server="+encodeURIComponent(s)+"&port="+p+"&secret="+encodeURIComponent(k);
  var tg="tg://proxy?"+qs, web="https://t.me/proxy?"+qs;
  document.getElementById("go").href=tg;
  document.getElementById("web").href=web;
  location.href=tg;
})();
</script></body></html>
